<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pemilihan Ekstrakurikuler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header>
            <div class="header-content">
                <button id="btn-back" class="hidden">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <h1>Pemilihan Ektrakulikuler Siswa SMP Negeri 2 Gemolong</h1>
            </div>
            <div id="loading-bar" class="hidden"></div>
        </header>

        <main>
            <!-- SCREEN 1: PILIH KELAS -->
            <section id="screen-kelas" class="screen active">
                <div class="screen-header">
                    <h2>Pilih Kelas</h2>
                    <p>Pilih kelas yang sedang Anda data</p>
                </div>
                <div class="grid-kelas" id="grid-kelas">
                    <!-- Kelas akan digenerate dari JS -->
                </div>
            </section>

            <!-- SCREEN 2: PILIH SISWA -->
            <section id="screen-siswa" class="screen hidden">
                <div class="screen-header">
                    <h2 id="title-kelas-terpilih">Kelas X</h2>
                    <p>Pilih siswa untuk memilih ekskul</p>
                </div>
                <div class="search-box">
                    <input type="text" id="search-siswa" placeholder="Cari nama siswa...">
                </div>
                <div class="list-siswa" id="list-siswa">
                    <!-- Daftar Siswa akan digenerate dari JS -->
                </div>
            </section>

            <!-- SCREEN 3: FORM PENILAIAN -->
            <section id="screen-form" class="screen hidden">
                <div class="student-card">
                    <h3 id="form-nama">Budi Santoso</h3>
                    <p id="form-nis">nis: 12345678</p>
                    <div class="student-details" style="margin-top: 10px;">
                        <p><strong>NISN:</strong> <span id="detail-nisn"></span></p>
                    </div>
                </div>

                <form id="form-penilaian">
                    <div class="section-divider">Pemilihan Ekstrakurikuler</div>
                    
                    <div class="form-group">
                        <label>Pilih Ekstrakurikuler</label>
                        <select id="input-ekskul">
                            <option value="">-- Belum Memilih Ekskul --</option>
                            <option value="PMR">PMR</option>
                            <option value="Tari">Tari</option>
                            <option value="Tapak Suci">Tapak Suci</option>
                            <option value="Taekwondo">Taekwondo</option>
                            <option value="Badminton">Badminton</option>
                            <option value="Karawitan">Karawitan</option>
                            <option value="Rebana">Rebana</option>
                            <option value="KIR">KIR</option>
                            <option value="Tahfidz">Tahfidz</option>
                            <option value="Seni Musik">Seni Musik</option>
                        </select>
                    </div>

                    <button type="submit" id="btn-submit" class="btn-primary">Simpan Nilai</button>
                </form>
            </section>

            <!-- SCREEN 4: SUCCESS -->
            <section id="screen-success" class="screen hidden text-center">
                <div class="success-icon">✓</div>
                <h2>Berhasil Disimpan!</h2>
                <p>Data penilaian untuk <strong id="success-nama">Siswa</strong> telah terekam.</p>
                <button type="button" class="btn-secondary mt-4" id="btn-next-student">Nilai Siswa Berikutnya</button>
            </section>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">Pesan disini</div>

    <script src="app.js"></script>
</body>
</html>
